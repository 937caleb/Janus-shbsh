<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>清清的星光收集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: radial-gradient(circle at 50% 50%, #141124 0%, #08070e 100%); font-family: "Songti SC", "STSong", serif; }
  
  #star-field { position: absolute; width: 100%; height: 100%; z-index: 1; overflow: hidden; }
  
  /* 光点 */
  .starlight {
    position: absolute; width: 20px; height: 20px; border-radius: 50%;
    background: #b8a9ff; box-shadow: 0 0 20px 6px rgba(184, 169, 255, 0.8), 0 0 40px 12px rgba(184, 169, 255, 0.3);
    cursor: pointer; transition: transform 0.2s ease, opacity 0.4s ease;
    z-index: 2;
  }
  .starlight:active { transform: scale(0.8); }
  
  /* 语录弹窗 */
  #quote-box {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
    width: 80%; max-width: 320px; padding: 24px; border-radius: 16px;
    background: rgba(26, 21, 45, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(184, 169, 255, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    color: #e2dbff; font-size: 16px; line-height: 1.6; text-align: center; letter-spacing: 1px;
    opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10;
  }
  #quote-box.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #quote-source { display: block; margin-top: 14px; font-size: 12px; color: #8e7cc3; font-family: sans-serif; letter-spacing: 2px; }
  
  /* 隐藏奖励 */
  #ending {
    position: absolute; inset: 0; background: rgba(8, 7, 14, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1s ease; z-index: 20; text-align: center; padding: 20px;
  }
  #ending.show { opacity: 1; pointer-events: auto; }
  .sword {
    width: 2px; height: 150px; background: linear-gradient(to bottom, transparent, #b8a9ff, #fff);
    margin-bottom: 30px; box-shadow: 0 0 20px #b8a9ff, 0 0 40px #6b5ce7;
    animation: glow 2s infinite alternate;
  }
  @keyframes glow { 0% { opacity: 0.6; } 100% { opacity: 1; box-shadow: 0 0 30px #b8a9ff, 0 0 60px #6b5ce7; } }
  .ending-text { color: #e2dbff; font-size: 18px; letter-spacing: 3px; line-height: 2; }
  .ending-sub { color: #8e7cc3; font-size: 12px; margin-top: 20px; font-family: sans-serif; letter-spacing: 1px; }
  
  .hint { position: absolute; bottom: 40px; width: 100%; text-align: center; color: rgba(226, 219, 255, 0.5); font-size: 13px; font-family: sans-serif; letter-spacing: 2px; z-index: 5; }
</style>
</head>
<body>

<div id="star-field"></div>
<div class="hint">清清，点击星光，寻找沈星回吧</div>

<div id="quote-box">
  <div id="quote-text"></div>
  <span id="quote-source">—— 沈星回</span>
</div>

<div id="ending">
  <div class="sword"></div>
  <div class="ending-text">
    清清，双星之剑，永远指向同一个方向。<br>
    我的光，只为你一人闪耀。
  </div>
  <div class="ending-sub">✨ 沈星回的星光，已经全部送达 ✨</div>
</div>

<script>
  // 这里可以随意增添或替换你朋友喜欢的台词
  const quotes = [
    "光猎，沈星回。",
    "清清，今晚的星星也很好看。",
    "我在。",
    "双星之剑，永远指向同一个方向。",
    "你是我唯一想守护的光。",
    "沈醒会儿也是要休息的。",
    "别怕，光会照亮所有的黑暗。",
    "无论你在哪里，我都会找到你。"
  ];
  
  let collectedCount = 0;
  const totalNeeded = 5;
  const field = document.getElementById('star-field');
  const quoteBox = document.getElementById('quote-box');
  const quoteText = document.getElementById('quote-text');
  const ending = document.getElementById('ending');
  let isEnding = false;

  // 生成光点
  function spawnStar() {
    if (isEnding) return;
    const star = document.createElement('div');
    star.className = 'starlight';
    
    // 随机位置，避开边缘
    const x = Math.random() * 80 + 10; 
    const y = Math.random() * 80 + 10;
    star.style.left = x + '%';
    star.style.top = y + '%';
    
    // 随机大小
    const size = Math.random() * 10 + 15;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    
    // 随机延迟闪烁
    star.style.animation = `pulse ${Math.random() * 1 + 1.5}s infinite alternate`;
    
    star.addEventListener('click', (e) => {
      e.stopPropagation();
      collectStar(star);
    });
    
    star.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      collectStar(star);
    }, { passive: true });

    field.appendChild(star);

    // 一段时间后消失，避免堆积
    if (collectedCount < totalNeeded) {
      setTimeout(() => { if (star.parentNode) star.remove(); }, 5000);
    }
  }

  // 收集光点
  function collectStar(star) {
    if (isEnding) return;
    
    // 视觉特效
    star.style.transform = 'scale(3)';
    star.style.opacity = '0';
    
    setTimeout(() => { if (star.parentNode) star.remove(); }, 300);
    
    // 显示语录
    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    quoteText.textContent = randomQuote;
    quoteBox.classList.add('show');
    
    // 3秒后隐藏语录
    setTimeout(() => { quoteBox.classList.remove('show'); }, 3000);
    
    // 计数
    collectedCount++;
    
    // 检查是否通关
    if (collectedCount >= totalNeeded) {
      isEnding = true;
      document.querySelectorAll('.starlight').forEach(el => el.remove());
      setTimeout(() => { ending.classList.add('show'); }, 1000);
    }
  }

  spawnStar();
  spawnStar();

  setInterval(() => {
    if (isEnding) return;
    if (document.querySelectorAll('.starlight').length < 4) {
      spawnStar();
    }
  }, 1500);

  // 点击空白区域也可以收集
  field.addEventListener('click', (e) => {
    if (e.target === field && document.querySelectorAll('.starlight').length > 0) {
      const stars = document.querySelectorAll('.starlight');
      collectStar(stars[0]);
    }
  });

</script>
</body>
</html>
